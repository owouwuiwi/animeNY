query AniListRecommendations($id: Int, $malId: Int, $type: MediaType!) {
  Media(id: $id, idMal: $malId, type: $type) {
    id
    recommendations(sort: [RATING_DESC], perPage: 20) {
      nodes {
        mediaRecommendation {
          id
          type
          isAdult
          title {
            userPreferred
          }
          coverImage {
            large
          }
        }
      }
    }
  }
}
